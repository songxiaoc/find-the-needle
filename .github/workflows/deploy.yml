name: Build and deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm validate:site && pnpm test:tools
      - run: pnpm exec opennextjs-cloudflare build
      - name: Check Worker artifact
        run: "! grep -R -F 'require(this.middlewareManifestPath)' .open-next/server-functions"
      - run: pnpm exec opennextjs-cloudflare deploy --config wrangler.jsonc
      - name: Verify deployed build
        shell: bash
        run: |
          expected="$(cat .open-next/assets/BUILD_ID)"
          for attempt in {1..12}; do
            actual="$(curl --fail --silent --show-error https://findtheneedle.site/BUILD_ID || true)"
            if [[ "$actual" == "$expected" ]]; then
              curl --fail --silent --show-error https://findtheneedle.site/ > /dev/null
              curl --fail --silent --show-error https://findtheneedle.site/sitemap.xml > /dev/null
              exit 0
            fi
            sleep 5
          done
          echo 'Production BUILD_ID does not match the deployed artifact.' >&2
          exit 1
