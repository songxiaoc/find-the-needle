name: Bug report
description: Something in the template does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands, files touched, and the smallest setup that shows the bug.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Template version / commit
      placeholder: git rev-parse --short HEAD
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        OS:
        Node:
        pnpm:
